version: '3.8'

services:
  email-assistant:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: email-assistant
    ports:
      - "8000:8000"
    volumes:
      - email-assistant-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  email-assistant-data:
    driver: local 